services:
  - type: web
    name: amibroker-web
    env: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
